<style>
/* Layout: une porte de frigo émaillée — chaque module est une fiche tenue par un aimant de couleur, une seule colonne pensée pour le téléphone, barre d'onglets en bas */
:root{
  --bg:#E6ECE9; --surface:#FAFCFB; --surface-2:#F0F4F2; --ink:#14302A; --muted:#5A6D67; --line:#D2DCD7;
  --m-blue:#2E52CF; --m-green:#2A8556; --m-red:#D4412D; --m-yellow:#C98F0E; --m-violet:#7648BE;
  --on-accent:#FFFFFF; --shadow:rgba(20,48,42,.16);
  --ok:#2A8556; --warn:#C98F0E; --bad:#D4412D;
  --f-display:"Bricolage Grotesque", "Arial Narrow", system-ui, sans-serif;
  --f-body:"Atkinson Hyperlegible", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-hand:"Caveat", "Comic Sans MS", cursive;
  --f-mono:"IBM Plex Mono", ui-monospace, Menlo, monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0F1715; --surface:#17221F; --surface-2:#1D2A26; --ink:#E4EEEA; --muted:#94A69F; --line:#2B3A35;
  --m-blue:#7290F5; --m-green:#53B985; --m-red:#EF6A54; --m-yellow:#E9B643; --m-violet:#A887E8;
  --on-accent:#0F1715; --shadow:rgba(0,0,0,.5); --ok:#53B985; --warn:#E9B643; --bad:#EF6A54; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0F1715; --surface:#17221F; --surface-2:#1D2A26; --ink:#E4EEEA; --muted:#94A69F; --line:#2B3A35;
  --m-blue:#7290F5; --m-green:#53B985; --m-red:#EF6A54; --m-yellow:#E9B643; --m-violet:#A887E8;
  --on-accent:#0F1715; --shadow:rgba(0,0,0,.5); --ok:#53B985; --warn:#E9B643; --bad:#EF6A54; color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.45;margin:0}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.wrap{max-width:620px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:18px 110px;display:flex;flex-direction:column;gap:18px}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--m-blue);outline-offset:2px;border-radius:6px}
h1,h2,h3{font-family:var(--f-display);margin:0;text-wrap:balance;letter-spacing:-.01em}
h1{font-size:clamp(28px,7vw,38px);font-weight:800;font-variation-settings:"wdth" 80;line-height:1.02}
h2{font-size:20px;font-weight:700;font-variation-settings:"wdth" 88}
h3{font-size:15px;font-weight:700}
.eyebrow{font-family:var(--f-mono);font-size:11.5px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.muted{color:var(--muted)}
.small{font-size:13.5px}
.num{font-variant-numeric:tabular-nums;font-family:var(--f-mono)}

/* top bar */
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap}
.sync{font-family:var(--f-mono);font-size:11px;letter-spacing:.04em;padding:5px 9px;border-radius:99px;background:var(--surface-2);color:var(--muted);display:inline-flex;gap:6px;align-items:center;white-space:nowrap}
.sync i{width:7px;height:7px;border-radius:50%;background:var(--muted)}
.sync[data-s="synced"] i{background:var(--ok)} .sync[data-s="saving"] i{background:var(--warn)}

/* slips held by magnets */
.slip{position:relative;background:var(--surface);border-radius:6px;padding:20px 16px 16px;box-shadow:0 1px 0 var(--line),0 10px 22px -16px var(--shadow);display:flex;flex-direction:column;gap:12px;min-width:0}
.slip>.mag{position:absolute;top:-7px;left:18px}
.mag{display:inline-block;width:16px;height:16px;border-radius:50%;background:var(--c,var(--m-blue));box-shadow:inset -2px -3px 0 rgba(0,0,0,.22),inset 2px 2px 0 rgba(255,255,255,.28),0 3px 4px -1px var(--shadow);flex:none}
.slip-head{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap}
.c-blue{--c:var(--m-blue)} .c-green{--c:var(--m-green)} .c-red{--c:var(--m-red)} .c-yellow{--c:var(--m-yellow)} .c-violet{--c:var(--m-violet)}

/* rows */
.list{display:flex;flex-direction:column}
.row{display:flex;align-items:center;gap:12px;padding:10px 0;border-top:1px solid var(--line);min-width:0}
.row:first-child{border-top:0}
.row .grow{flex:1;min-width:0}
.row .t{overflow-wrap:anywhere}
.row .sub{font-size:13px;color:var(--muted)}
.check{width:28px;height:28px;border-radius:8px;border:2px solid var(--line);background:transparent;display:grid;place-items:center;flex:none;padding:0;transition:background .15s,border-color .15s}
.check svg{width:16px;height:16px;opacity:0}
.check[aria-pressed="true"]{background:var(--c,var(--m-blue));border-color:var(--c,var(--m-blue))}
.check[aria-pressed="true"] svg{opacity:1;color:var(--on-accent)}
.done .t{text-decoration:line-through;color:var(--muted)}
.tag{font-family:var(--f-mono);font-size:10.5px;letter-spacing:.04em;text-transform:uppercase;padding:3px 7px;border-radius:99px;background:var(--surface-2);color:var(--muted);white-space:nowrap}
.tag.warn{background:color-mix(in srgb,var(--warn) 18%,transparent);color:var(--ink)}
.tag.bad{background:color-mix(in srgb,var(--bad) 16%,transparent);color:var(--ink)}

.btn{border:0;border-radius:10px;padding:10px 14px;background:var(--surface-2);font-weight:700;font-size:14.5px;display:inline-flex;align-items:center;gap:8px;justify-content:center}
.btn.primary{background:var(--c,var(--m-blue));color:var(--on-accent)}
.btn.ghost{background:transparent;border:1.5px dashed var(--line);color:var(--muted)}
.btn.sm{padding:6px 10px;font-size:13px;border-radius:8px}
.link{background:none;border:0;padding:0;color:var(--c,var(--m-blue));font-weight:700;font-size:14px;text-decoration:underline;text-underline-offset:3px}
.icon-btn{background:none;border:0;padding:6px;border-radius:8px;color:var(--muted);display:grid;place-items:center}
.icon-btn svg{width:18px;height:18px}
.btns{display:flex;gap:8px;flex-wrap:wrap}

.add{display:flex;gap:8px;min-width:0}
.add input,.add select{min-width:0}
input[type=text],input[type=date],input[type=time],input[type=number],select,textarea{background:var(--surface-2);border:1.5px solid transparent;border-radius:10px;padding:10px 12px;width:100%}
input:focus,select:focus,textarea:focus{border-color:var(--c,var(--m-blue));outline:none}
.add input{flex:1}
.add select{width:auto;flex:none}
.empty{color:var(--muted);font-size:14px;padding:6px 0}

/* plant / progress */
.grow-card{display:grid;grid-template-columns:96px 1fr;gap:14px;align-items:center}
.grow-card svg.plant{width:96px;height:120px}
.week{display:flex;gap:6px;margin-top:8px}
.week div{display:flex;flex-direction:column;align-items:center;gap:4px;font-family:var(--f-mono);font-size:10.5px;color:var(--muted)}
.week b{width:22px;height:22px;border-radius:50%;border:2px solid var(--line);display:block}
.week b.on{background:var(--m-green);border-color:var(--m-green)}
.week b.today{outline:2px solid var(--ink);outline-offset:2px}
.hand{font-family:var(--f-hand);font-size:22px;line-height:1.1}

.hardbar{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;background:var(--surface-2);border-radius:10px;padding:10px 12px}
.anchor{font-size:12.5px;color:var(--muted);display:block}
.miss{font-size:11.5px;font-family:var(--f-mono);color:var(--ink);background:color-mix(in srgb,var(--warn) 20%,transparent);border-radius:6px;padding:2px 6px;display:inline-block;margin-top:3px}

/* chores */
.fresh{height:6px;border-radius:99px;background:var(--surface-2);overflow:hidden;margin-top:6px}
.fresh i{display:block;height:100%;border-radius:99px}
.effort{display:inline-flex;gap:2px;vertical-align:middle}
.effort span{width:5px;height:5px;border-radius:50%;background:var(--line)}
.effort span.on{background:var(--muted)}
.zone-h{display:flex;align-items:baseline;justify-content:space-between;margin-top:6px}
.session{background:var(--surface-2);border-radius:10px;padding:12px;display:flex;flex-direction:column;gap:8px}
.countdown{font-family:var(--f-mono);font-size:34px;font-variant-numeric:tabular-nums;letter-spacing:.02em}

/* meals */
.weeknav{display:flex;align-items:center;justify-content:space-between;gap:8px}
.day{display:grid;grid-template-columns:62px 1fr 1fr;gap:8px;align-items:stretch;padding:8px 0;border-top:1px solid var(--line)}
.day:first-of-type{border-top:0}
.day .dn{font-family:var(--f-display);font-weight:700;font-variation-settings:"wdth" 80;line-height:1.1;padding-top:6px}
.day .dn small{display:block;font-family:var(--f-mono);font-weight:500;font-size:11px;color:var(--muted)}
.day.is-today .dn{color:var(--m-red)}
.meal{border:0;border-radius:8px;background:var(--surface-2);text-align:left;padding:8px 10px;font-size:14px;min-height:52px;min-width:0;overflow-wrap:anywhere;display:flex;flex-direction:column;justify-content:center}
.meal small{font-family:var(--f-mono);font-size:10px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.meal.empty-slot{background:transparent;border:1.5px dashed var(--line);color:var(--muted)}
.tip{border-left:3px solid var(--c,var(--m-red));padding:4px 0 4px 12px;font-size:14px;color:var(--muted)}

/* shopping */
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1.5px solid var(--line);background:transparent;border-radius:99px;padding:6px 11px;font-size:13.5px}
.chip.in{background:color-mix(in srgb,var(--m-yellow) 22%,transparent);border-color:transparent}
.rayon{font-family:var(--f-mono);font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);padding-top:12px}

/* agenda */
.date-h{font-family:var(--f-display);font-weight:700;font-size:15px;padding-top:12px;text-transform:capitalize}
.time{font-family:var(--f-mono);font-size:13px;color:var(--muted);width:48px;flex:none}
.notes{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:14px}
.note{position:relative;background:color-mix(in srgb,var(--m-yellow) 22%,var(--surface));padding:18px 12px 12px;border-radius:3px;font-family:var(--f-hand);font-size:21px;line-height:1.15;box-shadow:0 8px 14px -12px var(--shadow);overflow-wrap:anywhere;min-width:0}
.note:nth-child(even){transform:rotate(1.2deg)} .note:nth-child(odd){transform:rotate(-1deg)}
.note .mag{position:absolute;top:-6px;left:50%;margin-left:-8px}
.note .icon-btn{position:absolute;top:2px;right:2px;padding:4px}

/* tabs */
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
nav.tabs .in{max-width:620px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr)}
nav.tabs button{background:none;border:0;padding:9px 2px 8px;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11.5px;color:var(--muted);position:relative}
nav.tabs svg{width:22px;height:22px}
nav.tabs button[aria-current="page"]{color:var(--ink);font-weight:700}
nav.tabs button[aria-current="page"]::before{content:"";position:absolute;top:-1px;left:30%;right:30%;height:3px;border-radius:0 0 3px 3px;background:var(--c)}
.badge{position:absolute;top:5px;left:calc(50% + 7px);min-width:16px;height:16px;border-radius:99px;background:var(--m-red);color:#fff;font-size:10px;font-family:var(--f-mono);display:grid;place-items:center;padding:0 4px}

/* sheet */
.scrim{position:fixed;inset:0;background:rgba(10,20,18,.45);z-index:40;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--surface);width:100%;max-width:620px;max-height:88vh;overflow:auto;border-radius:16px 16px 0 0;padding:20px max(16px,env(safe-area-inset-right,0px)) calc(20px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:14px;animation:up .2s ease-out}
@keyframes up{from{transform:translateY(24px);opacity:.6}to{transform:none;opacity:1}}
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-size:13px;font-weight:700;color:var(--muted)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.pick{display:flex;flex-direction:column;gap:6px;max-height:260px;overflow:auto}
.pick button{text-align:left;border:0;background:var(--surface-2);border-radius:8px;padding:10px 12px}
.seg{display:flex;background:var(--surface-2);border-radius:10px;padding:3px;gap:3px}
.seg label{flex:1;text-align:center;padding:7px 4px;border-radius:8px;font-size:13.5px;cursor:pointer}
.seg input{position:absolute;opacity:0;pointer-events:none}
.seg label:has(input:checked){background:var(--surface);font-weight:700;box-shadow:0 1px 3px var(--shadow)}

.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-size:14px;z-index:50;max-width:calc(100% - 32px)}

@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}
@media (max-width:380px){.day{grid-template-columns:52px 1fr 1fr}.grow-card{grid-template-columns:76px 1fr}.grow-card svg.plant{width:76px;height:96px}}
</style>

<script>
(function(){
"use strict";
/* ---------- helpers ---------- */
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const uid=()=>Math.random().toString(36).slice(2,10);
const iso=d=>{const x=new Date(d);return x.getFullYear()+"-"+String(x.getMonth()+1).padStart(2,"0")+"-"+String(x.getDate()).padStart(2,"0")};
const parse=s=>{const [y,m,d]=s.split("-").map(Number);return new Date(y,m-1,d)};
const addDays=(s,n)=>{const d=parse(s);d.setDate(d.getDate()+n);return iso(d)};
const diff=(a,b)=>Math.round((parse(b)-parse(a))/86400000);
const TODAY=()=>iso(new Date());
const monday=s=>{const d=parse(s);d.setDate(d.getDate()-((d.getDay()+6)%7));return iso(d)};
const longDay=s=>parse(s).toLocaleDateString("fr-FR",{weekday:"long",day:"numeric",month:"long"});
const shortDay=s=>parse(s).toLocaleDateString("fr-FR",{day:"numeric",month:"short"});
const JOURS=["Lun","Mar","Mer","Jeu","Ven","Sam","Dim"];
const CHECK='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>';
const X='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>';
const PEN='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20h4L19 9l-4-4L4 16v4z"/></svg>';

const RAYONS=["Fruits & légumes","Frais","Viande & poisson","Boulangerie","Épicerie","Surgelés","Boissons","Hygiène","Entretien","Autre"];
const GUESS=[
 [/(pomme|banane|tomate|salade|carotte|oignon|ail|courgette|poivron|citron|orange|concombre|légume|legume|fruit|brocoli|épinard|champignon|avocat|poireau|patate|pommes de terre)/i,"Fruits & légumes"],
 [/(lait|yaourt|fromage|beurre|crème|creme|œuf|oeuf|feta|gruyère|gruyere|jambon|fromage blanc|skyr|mozzarella)/i,"Frais"],
 [/(poulet|bœuf|boeuf|steak|viande|dinde|porc|saumon|poisson|cabillaud|thon frais|crevette)/i,"Viande & poisson"],
 [/(pain|baguette|brioche|tortilla|wrap)/i,"Boulangerie"],
 [/(surgel|glace|frites|haricots verts)/i,"Surgelés"],
 [/(eau|jus|soda|bière|biere|vin|café|cafe|thé|the)/i,"Boissons"],
 [/(dentifrice|shampo|savon|gel douche|déodorant|deodorant|papier toilette|coton|rasoir|mouchoir)/i,"Hygiène"],
 [/(liquide vaisselle|lessive|éponge|eponge|sac poubelle|sacs poubelle|javel|nettoyant|sopalin|essuie)/i,"Entretien"],
 [/(pâtes|pates|riz|farine|sucre|huile|sel|poivre|conserve|thon|lentille|pois chiche|haricot|sauce|coulis|céréale|cereale|flocon|avoine|épice|epice|lait de coco|quinoa|maïs|mais|semoule|confiture|miel)/i,"Épicerie"]
];
const guess=n=>{for(const [r,v] of GUESS) if(r.test(n)) return v; return "Autre"};

/* ---------- seed ---------- */
function seed(){
 const t=TODAY();
 const ch=(zone,name,every,effort,frac)=>({id:uid(),zone,name,every,effort,last:addDays(t,-Math.round(every*frac)),prev:null});
 const R=(name,ings,tag)=>({id:uid(),name,tag:tag||"",ings:ings.map(n=>({n,r:guess(n)}))});
 const recipes=[
  R("Pâtes complètes, thon et tomates",["pâtes complètes","thon en boîte","coulis de tomate","oignon"],"15 min"),
  R("Poulet, riz et brocolis",["blancs de poulet","riz","brocolis surgelés"],"20 min"),
  R("Omelette, pommes de terre et salade",["œufs","pommes de terre","salade"],"20 min"),
  R("Chili sin carne",["haricots rouges en conserve","maïs en conserve","tomates concassées","riz","oignon"],"double portion"),
  R("Dahl de lentilles corail",["lentilles corail","lait de coco","carottes","oignon","riz"],"double portion"),
  R("Saumon, pommes de terre, haricots verts",["pavés de saumon surgelés","pommes de terre","haricots verts surgelés"],"25 min"),
  R("Wraps poulet crudités",["tortillas","blancs de poulet","salade","tomates","fromage blanc"],"15 min"),
  R("Soupe de légumes et tartines",["légumes pour soupe","pain complet","fromage"],"double portion"),
  R("Salade pois chiches et feta",["pois chiches en conserve","tomates","concombre","feta","quinoa"],"10 min"),
  R("Gratin de pâtes au jambon",["pâtes","jambon","gruyère râpé","crème légère"],"30 min")
 ];
 const mon=monday(t), meals={};
 const plan=[[1,"soir"],[2,"soir"],[0,"soir"],[4,"soir"],[3,"midi"]];
 plan.forEach(([ri,slot],i)=>{const d=addDays(mon,i);(meals[d]=meals[d]||{})[slot]="r:"+recipes[ri].id;});
 const d1=parse(t); const firstOfMonth=iso(new Date(d1.getFullYear(),d1.getMonth(),1)); const third=iso(new Date(d1.getFullYear(),d1.getMonth(),3));
 return {
  v:1, updatedAt:0, plant:0,
  chores:[
   ch("Cuisine","Faire la vaisselle",1,1,.5),ch("Cuisine","Essuyer le plan de travail",1,1,0),ch("Cuisine","Sortir les poubelles",3,1,.7),
   ch("Cuisine","Nettoyer l'évier",7,1,1.1),ch("Cuisine","Nettoyer le micro-ondes",14,1,.4),ch("Cuisine","Vider et laver le frigo",30,2,.6),
   ch("Salle de bain","Nettoyer le lavabo",7,1,.9),ch("Salle de bain","Nettoyer la douche",7,2,1.3),ch("Salle de bain","Nettoyer les WC",7,1,.6),ch("Salle de bain","Changer les serviettes",7,1,.3),
   ch("Chambre","Faire le lit",1,1,0),ch("Chambre","Changer les draps",14,2,.8),ch("Chambre","Ranger les vêtements",3,1,.4),
   ch("Salon","Ranger 10 objets qui traînent",1,1,1),ch("Salon","Dépoussiérer",14,2,.5),
   ch("Sols","Passer l'aspirateur",7,2,.95),ch("Sols","Passer la serpillière",14,2,.7),
   ch("Linge","Lancer une machine",3,1,.8),ch("Linge","Étendre et plier le linge",3,1,.5)
  ],
  habits:[
   {id:uid(),when:"matin",anchor:"j'éteins le réveil",action:"je bois un grand verre d'eau"},
   {id:uid(),when:"matin",anchor:"je me lève",action:"je fais mon lit (1 minute)"},
   {id:uid(),when:"matin",anchor:"le petit-déjeuner",action:"j'ouvre Aimanté et je lis ma journée"},
   {id:uid(),when:"soir",anchor:"le dîner",action:"je lave ou range la vaisselle tout de suite"},
   {id:uid(),when:"soir",anchor:"je me brosse les dents",action:"je prépare mes affaires de demain"},
   {id:uid(),when:"soir",anchor:"je me mets au lit",action:"je pose le téléphone hors de portée"}

 try{await dbRef.set({state:snap,updatedAt:snap.updatedAt});if(!dirty)setSync("synced");}

  if(e&&e.code==="unavailable"){dirty=true;writing=false;setTimeout(flush,1200+Math.random()*1200);return}
  if(e&&e.code==="quota_exceeded") toast("Espace de sauvegarde plein : supprime d'anciennes recettes ou notes.");

async function connect(){
 if(!window.claude||typeof window.claude.use!=="function") return;
 try{
  const [db,user]=await Promise.all([window.claude.use("db"),window.claude.use("user")]);
  if(!db||!user) return;
  const id=await user.id(); if(!id) return;
  dbRef=db.doc("data/users/"+id+"/aimante");
  const lt=setTimeout(()=>{if(syncState!=="synced")setSync("offline")},10000);
  dbRef.onSnapshot(snap=>{
   if(!snap.metadata.fromCache) clearTimeout(lt);
   if(snap.metadata.hasPendingWrites) return;
   if(!snap.exists){ if(!snap.metadata.fromCache){dirty=true;flush();} return; }
   const rs=(snap.data()||{}).state; if(!rs) return;
   const ru=rs.updatedAt||0, lu=state.updatedAt||0;
   if(ru>lu && !dirty && !writing){state=migrate(JSON.parse(JSON.stringify(rs)));saveLocal();render();}
   else if(ru<lu && !dirty && !writing){dirty=true;flush();return}

 task:fd=>{const v=(fd.get("title")||"").trim();if(!v)return;state.tasks.push({id:uid(),title:v,type:fd.get("type"),date:TODAY(),done:false});commit();refocus("task-in")},
 shop:fd=>{const v=(fd.get("n")||"").trim();if(!v)return;state.shopping.push({id:uid(),n:v,r:guess(v),done:false});commit();refocus("shop-in")},
 back:fd=>{const v=(fd.get("title")||"").trim();if(!v)return;state.backlog.push({id:uid(),title:v});commit();refocus("back-in")},
 memo:fd=>{const v=(fd.get("text")||"").trim();if(!v)return;state.memos.push({id:uid(),text:v});commit();refocus("memo-in")},
 staple:fd=>{const v=(fd.get("n")||"").trim();if(!v)return;state.staples.push({id:uid(),n:v,r:guess(v)});commit();staplesSheet()},
 habit:fd=>{state.habits.push({id:uid(),anchor:fd.get("anchor").trim(),action:fd.get("action").trim(),when:fd.get("when")||"matin"});commit();habitsSheet();toast("Routine ajoutée. Commence petit.")},
 mealText:(fd,f)=>{const v=(fd.get("t")||"").trim();const m=state.meals[f.dataset.d]=state.meals[f.dataset.d]||{};if(v)m[f.dataset.s]="t:"+v;else delete m[f.dataset.s];close();commit()},
 chore:(fd,f)=>{const o={name:fd.get("name").trim(),zone:fd.get("zone").trim()||"Autre",every:Math.max(1,+fd.get("every")||7),effort:+fd.get("effort")||1};
  if(f.dataset.id){Object.assign(state.chores.find(c=>c.id===f.dataset.id),o)}else state.chores.push({id:uid(),last:null,prev:null,...o});close();commit()},
 recipe:(fd,f)=>{const ings=String(fd.get("ings")||"").split("\n").map(s=>s.trim()).filter(Boolean).map(n=>({n,r:guess(n)}));const o={name:fd.get("name").trim(),tag:fd.get("tag").trim(),ings};
  if(f.dataset.id)Object.assign(state.recipes.find(r=>r.id===f.dataset.id),o);else state.recipes.push({id:uid(),...o});close();commit()},
 ev:(fd,f)=>{const o={title:fd.get("title").trim(),date:fd.get("date"),time:fd.get("time")||"",kind:fd.get("kind")||"rdv",repeat:fd.get("repeat")||"none"};
  if(f.dataset.id)Object.assign(state.events.find(e=>e.id===f.dataset.id),o);else state.events.push({id:uid(),...o});
  if(planning){state.backlog=state.backlog.filter(b=>b.id!==planning);planning=null}close();commit()}
};
function refocus(id){const el=document.getElementById(id);if(el)el.focus()}
document.addEventListener("click",e=>{const b=e.target.closest("[data-act]");if(!b)return;const fn=A[b.dataset.act];if(fn)fn(b.dataset,b,e)});
document.addEventListener("submit",e=>{const f=e.target.closest("form[data-form]");if(!f)return;e.preventDefault();const fn=F[f.dataset.form];if(fn)fn(new FormData(f),f)});
document.addEventListener("keydown",e=>{if(e.key==="Escape")close()});
document.addEventListener("visibilitychange",()=>{if(!document.hidden)render()});

render();
setTimeout(connect,0);
})();
</script>
